<!DOCTYPE html>
<!-- Prediction: I expect oklab to look livelier because perceptual mixing may preserve a brighter-looking transition between these colors. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Swatch Test</title>
        <style>
            .box {
                width: 200px;
                height: 200px;
            }

            .a {
                background-color: color-mix(in srgb, #c4513a 50%, #2f6f8f 50%);
            }

            .b {
                background-color: color-mix(in oklab, #c4513a 50%, #2f6f8f 50%);
            }
        </style>
    </head>
    <body>
        <h1>Swatch Test</h1>
        <p>Two boxes mix the same colors in equal proportions, using different color spaces.</p>
        <p>srgb</p>
        <div class="box a"></div>
        <p>oklab</p>
        <div class="box b"></div>
        <!-- Observation: I predicted oklab would look livelier, but srgb looked darker while oklab looked softer and more muted. I would use oklab for a calm, balanced palette, and srgb when I want a darker, bolder mix. -->
    </body>
</html>
